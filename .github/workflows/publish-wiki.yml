name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push wiki pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo

          # /docs is a single flat directory mirrored verbatim as the wiki's
          # page set (Home.md included — it's just the page GitHub treats as
          # the landing page). Clear the old tree first so pages renamed or
          # removed from /docs don't linger.
          find wiki-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp docs/*.md wiki-repo/

          cd wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "docs: sync wiki from main (${GITHUB_SHA::7})"
            git push
          fi
