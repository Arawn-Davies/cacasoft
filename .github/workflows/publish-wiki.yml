name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'CacaVM/wiki/**'
      - 'cacalang/docs/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push wiki pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo

          # Home.md is the wiki's landing page and must stay at the repo root;
          # everything else lives under docs/<project>/ so CacaVM and cacalang
          # docs don't collide.
          mkdir -p wiki-repo/docs/cacavm wiki-repo/docs/cacalang
          cp CacaVM/wiki/*.md wiki-repo/docs/cacavm/
          mv wiki-repo/docs/cacavm/Home.md wiki-repo/Home.md
          cp cacalang/docs/*.md wiki-repo/docs/cacalang/

          cd wiki-repo
          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "docs: sync wiki from main (${GITHUB_SHA::7})"
            git push
          fi
