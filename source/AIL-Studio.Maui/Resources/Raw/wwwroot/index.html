<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body, #container { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        // Defined synchronously, before the async Monaco load even starts, so C# can
        // call these immediately after page load without racing Monaco's
        // initialization or depending on the HybridWebView message bridge at all
        // (that bridge's own readiness is a separate, harder-to-pin-down race —
        // getEditorText/setEditorText no longer depend on it working).
        window._editorInstance = null;
        window._pendingText = null;

        // Text crosses the C#<->JS boundary as base64 (see MainPage.xaml.cs for why:
        // embedding real source text as a JS string literal silently failed for real
        // content, even as little as 50 characters). Base64's alphabet has nothing in
        // it that any string-escaping layer could misinterpret.
        function base64ToUtf8(b64) {
            var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
            return new TextDecoder('utf-8').decode(bytes);
        }
        function utf8ToBase64(str) {
            var bytes = new TextEncoder().encode(str);
            var binary = '';
            for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        window.setEditorTextBase64 = function (b64) {
            var text = base64ToUtf8(b64);
            if (window._editorInstance) window._editorInstance.setValue(text);
            else window._pendingText = text;
        };
        window.getEditorTextBase64 = function () {
            var value = window._editorInstance ? window._editorInstance.getValue() : (window._pendingText || '');
            // No JSON.stringify: base64 text has no characters that need JSON
            // escaping, and double-encoding it here (on top of whatever
            // EvaluateJavaScriptAsync itself does for string results) was exactly
            // what broke this on the C# side.
            return utf8ToBase64(value);
        };
        window.getEditorPosition = function () {
            if (!window._editorInstance) return JSON.stringify({ line: 1, column: 1 });
            var p = window._editorInstance.getPosition();
            return JSON.stringify({ line: p.lineNumber, column: p.column });
        };
    </script>
    <script src="vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'vs' } });
        require(['vs/editor/editor.main'], function () {
            // AIL Monarch tokenizer — mirrors AIL-Studio.Avalonia/AilSyntaxColorizer.cs and
            // the original WinForms MainForm.cs regex highlighter, translated to Monarch rules.
            monaco.languages.register({ id: 'ail' });
            monaco.languages.setMonarchTokensProvider('ail', {
                ignoreCase: true,
                mnemonics: [
                    'MOV', 'MOM', 'MOE', 'SWP', 'TEQ', 'TNE', 'TLT', 'TMT',
                    'ADD', 'SUB', 'INC', 'DEC', 'MUL', 'DIV',
                    'SHL', 'SHR', 'ROL', 'ROR', 'AND', 'BOR', 'XOR', 'NOT',
                    'JMP', 'CLL', 'RET', 'JMT', 'JMF', 'CLT', 'CLF',
                    'PSH', 'POP', 'INB', 'INW', 'IND', 'OUB', 'OUW', 'OUD',
                    'SWI', 'KEI'
                ],
                registers: [
                    'PC', 'IP', 'SP', 'SS', 'AH', 'AL', 'A', 'BH', 'BL', 'B',
                    'CH', 'CL', 'C', 'X', 'Y'
                ],
                tokenizer: {
                    root: [
                        [/;.*$/, 'comment'],
                        [/\/\/.*$/, 'comment'],
                        [/^\s*[A-Za-z_]\w*\s*:/, 'type.identifier'],
                        [/'(\\.|[^\\'])'/, 'number'],
                        [/\b0x[0-9A-Fa-f]+\b/, 'number.hex'],
                        [/\b\d+\b/, 'number'],
                        [/"[^"]*"/, 'string'],
                        [/[A-Za-z_]\w*/, {
                            cases: {
                                '@mnemonics': 'keyword',
                                '@registers': 'type',
                                '@default': 'identifier'
                            }
                        }],
                    ]
                }
            });

            // VS Code Dark+-derived palette — same hex values as AIL-Studio.Avalonia's
            // App.axaml resources and the WinForms IDE's color scheme.
            monaco.editor.defineTheme('ail-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '6A9955' },
                    { token: 'keyword', foreground: '569CD6' },
                    { token: 'type', foreground: '9CDCFE' },
                    { token: 'type.identifier', foreground: 'DCDCAA' },
                    { token: 'number', foreground: 'CE9178' },
                    { token: 'number.hex', foreground: 'CE9178' },
                    { token: 'string', foreground: 'CE9178' },
                ],
                colors: {
                    'editor.background': '#1E1E1E',
                    'editor.foreground': '#D4D4D4',
                }
            });

            var editorInstance = monaco.editor.create(document.getElementById('container'), {
                value: window._pendingText || '',
                language: 'ail',
                theme: 'ail-dark',
                automaticLayout: true,
                fontFamily: "Menlo, Consolas, 'Courier New', monospace",
                fontSize: 14,
                minimap: { enabled: false },
            });
            window._editorInstance = editorInstance;
            window._pendingText = null;
            window.editor = editorInstance; // kept for console debugging convenience

            editorInstance.onDidChangeCursorPosition(function () {
                if (window.HybridWebView) {
                    window.HybridWebView.SendRawMessage('cursor:' + window.getEditorPosition());
                }
            });
            editorInstance.onDidChangeModelContent(function () {
                if (window.HybridWebView) {
                    window.HybridWebView.SendRawMessage('modified');
                }
            });
        });
    </script>
</body>
</html>
